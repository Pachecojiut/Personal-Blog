<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Blog</title>
</head>
<body>
    <h1>Meu Blog Pessoal</h1>
    <p>Bem-vindo ao meu blog!</p>

    {% for article in articles %}

        <h2>{{ article['titulo'] }}</h2>

        <p>{{ article['data'] }}</p>

        <p>{{ article['conteudo'] }}</p>

        <a href="/article/{{ article['id'] }}">Ler artigo</a>

    {% endfor %}

    </small>{{ data }}<small>
</body>
</html>
